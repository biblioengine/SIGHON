<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIGHON Frame Test</title>
<style>
:root{--bg:#e8e8eb;--fg:#17161b;--muted:#6f6d77;--line:#c9c8cf;--accent:#c4267d;--ok:#2f7d3a;--ng:#b3261e}
@media (prefers-color-scheme: dark){:root{--bg:#111014;--fg:#ebe9f0;--muted:#8d8996;--line:#2f2c35;--accent:#e4589f;--ok:#7bc77f;--ng:#ff8a80}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:16px 16px 60px}
h1{font-size:20px;margin:0 0 4px}
.muted{color:var(--muted)}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:10px 18px;font-size:15px;font-weight:600}
#status{font-weight:700;margin:12px 0}
#res{border:2px solid var(--accent);border-radius:10px;padding:12px;display:none}
#res p{margin:6px 0}
.best{color:var(--ok);font-weight:700}
pre{font:11px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:var(--muted)}
</style>
</head>
<body>
<h1>SIGHON コマ受け渡しテスト</h1>
<p class="muted">書き出しで描いた1コマ（1080×1920）を動画用のコマにする方法を5通り試し、どれが速いかを比べます。ボタンを押したら終わるまで画面をそのままにしてください（1〜3分）。</p>
<button class="btn" id="go">テストを始める</button>
<div id="status"></div>
<div id="res"><b>結果（1コマあたり。小さいほど速い）</b><div id="rows"></div></div>
<pre id="log"></pre>
<script>
(()=>{
const W=1080,H=1920,N=60,FPS=30;
const $=id=>document.getElementById(id), log=s=>{$('log').textContent+=s+'\n';};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
// 実際の書き出しに近い絵を描く（背景・文字・映像の代わりの絵・紙の代わりの小さな絵の拡大）
const small=document.createElement('canvas'); small.width=288; small.height=162;
const sg=small.getContext('2d'); const src=document.createElement('canvas'); src.width=1080; src.height=608; const vg=src.getContext('2d');
function drawFrame(g,k){
 for(let i=0;i<8;i++){vg.fillStyle=`hsl(${(i*45+k*3)%360},80%,55%)`;vg.fillRect(i*135,0,135,608);}
 sg.fillStyle='#f4f2ec';sg.fillRect(0,0,288,162);sg.fillStyle=`rgba(200,60,200,.6)`;sg.beginPath();sg.arc(144+Math.sin(k/9)*60,81,30,0,6.3);sg.fill();
 g.fillStyle='#e8e8eb'; g.fillRect(0,0,W,H);
 g.fillStyle='#17161b'; g.font='92px serif'; g.fillText('SIGHON-彩音-',81,380);
 g.drawImage(src,84,430,912,513);
 g.imageSmoothingEnabled=true; g.drawImage(small,84-k%5,980,920,513);
 g.fillStyle='rgba(204,34,132,.88)'; g.fillRect(538,980,3,513);
 g.font='40px monospace'; g.textAlign='right'; g.fillText('0:'+String(k%60).padStart(2,'0')+' / 1:08',996,1560); g.textAlign='left';
}
async function makeEncoder(){
 for(const codec of ['avc1.640028','avc1.4d0028','vp09.00.40.08']){
  const cfg={codec,width:W,height:H,bitrate:8e6,framerate:FPS,latencyMode:'quality'}; if(codec.startsWith('avc'))cfg.avc={format:'avc'};
  try{if((await VideoEncoder.isConfigSupported(cfg)).supported){let n=0,err=null;const e=new VideoEncoder({output:()=>{n++;},error:x=>{err=x;}});e.configure(cfg);return {e,cfg,count:()=>n,err:()=>err};}}catch(x){}
 }
 throw new Error('エンコーダーがありません');
}
// 5通りの「受け渡し」
const methods=[
 {id:'A',name:'今の方法（画面用キャンバス → コマ）',setup(){const c=document.createElement('canvas');c.width=W;c.height=H;return {g:c.getContext('2d'),mk:ts=>new VideoFrame(c,{timestamp:ts})};}},
 {id:'B',name:'読み出し向けキャンバス → コマ',setup(){const c=document.createElement('canvas');c.width=W;c.height=H;return {g:c.getContext('2d',{willReadFrequently:true}),mk:ts=>new VideoFrame(c,{timestamp:ts})};}},
 {id:'C',name:'画素を読み出して → コマ（RGBA）',setup(){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d',{willReadFrequently:true});
   return {g,mk:ts=>{const d=g.getImageData(0,0,W,H).data;return new VideoFrame(d,{format:'RGBA',codedWidth:W,codedHeight:H,timestamp:ts});}};}},
 {id:'D',name:'画面外キャンバス → 画像 → コマ',setup(){if(typeof OffscreenCanvas==='undefined')return null;const c=new OffscreenCanvas(W,H);const g=c.getContext('2d');
   return {g,mk:ts=>new VideoFrame(c.transferToImageBitmap(),{timestamp:ts})};}},
 {id:'E',name:'画像にしてから → コマ',async:true,setup(){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
   return {g,mk:async ts=>{const b=await createImageBitmap(c);const f=new VideoFrame(b,{timestamp:ts});b.close();return f;}};}},
];
$('go').addEventListener('click',async()=>{
 $('go').disabled=true; $('rows').innerHTML=''; $('res').style.display='none'; $('log').textContent=navigator.userAgent+'\n';
 if(!('VideoEncoder' in window)){$('status').textContent='このブラウザは対応していません';return;}
 const results=[];
 for(const m of methods){
  $('status').textContent=`${m.id}：${m.name} を試しています…`;
  let r={m,mk:0,total:0,ok:false,note:''};
  try{
   const s=m.setup(); if(!s){r.note='このブラウザでは使えません';results.push(r);continue;}
   const enc=await makeEncoder(); let tMk=0; const t0=performance.now();
   for(let k=0;k<N;k++){
    drawFrame(s.g,k);
    const a=performance.now(); let f=s.mk(Math.round(k*1e6/FPS)); if(f&&f.then)f=await f; tMk+=performance.now()-a;
    enc.e.encode(f,{keyFrame:k===0}); f.close();
    while(enc.e.encodeQueueSize>4)await wait(1);
    if(enc.err())throw enc.err();
    if(k%10===0)await wait(0);
   }
   await enc.e.flush(); const total=performance.now()-t0; const out=enc.count(); enc.e.close();
   r.mk=tMk/N; r.total=total/N; r.ok=out===N; if(!r.ok)r.note=`書き出せたのは ${out}/${N} コマ`;
   log(`${m.id} mk=${r.mk.toFixed(1)}ms total=${r.total.toFixed(1)}ms out=${out} codec=${enc.cfg.codec}`);
  }catch(e){r.note='失敗：'+(e&&e.message||e); log(`${m.id} error ${e&&e.message||e}`);}
  results.push(r); await wait(300);
 }
 const okR=results.filter(r=>r.ok); const best=okR.length?okR.reduce((a,b)=>a.total<b.total?a:b):null;
 $('rows').innerHTML=results.map(r=>`<p class="${r===best?'best':''}">${r.m.id}. ${r.m.name}<br>${r.ok?`受け渡し ${r.mk.toFixed(1)}ms・全体 ${r.total.toFixed(1)}ms（今回と同じ77秒の動画なら約 ${Math.round(r.total*FPS*77/1000)}秒）`:r.note}</p>`).join('');
 $('res').style.display='block'; $('status').textContent='テスト完了。結果の枠のスクリーンショットを送ってください。'; $('go').disabled=false;
});
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGHON 録画テスト2</title>
<style>
:root{--bg:#e8e8eb;--ink:#17161b;--paper:#fff;--accent:#c4267d}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Hiragino Sans",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:10px}
h1{font-size:1.2rem;margin:4px 0}
p{margin:0;font-size:.92rem}
button{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer}
button.on{border-color:var(--accent);background:#fbe3ef}
.no{display:inline-block;min-width:1.8em;font-weight:700}
#log{background:var(--paper);border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;min-height:4em}
</style>
</head>
<body>
<main>
  <h1>SIGHON 録画テスト2</h1>
  <p>ページを開き直してから、マイクをオフにして画面収録を始め、A〜Eを順に1つずつ押してください。それぞれ8秒で止まります。録画を見返して、ノイズなく入っていた記号を教えてください。録画中、スピーカーから聞こえる音が普通だったかどうかも教えてください。</p>
  <button id="A"><span class="no">A</span>和音（AAC 48kHz）をふつうのファイルとして鳴らす</button>
  <button id="B"><span class="no">B</span>Aと同じ和音を、ページ内で読み込んでから鳴らす（blob）</button>
  <button id="C"><span class="no">C</span>和音（WAV 44.1kHz）をふつうのファイルとして鳴らす</button>
  <button id="D"><span class="no">D</span>Ballerino を AAC 48kHz に作り直したもの（ページ内で戻して鳴らす）</button>
  <button id="E"><span class="no">E</span>Ballerino の元の mp3（ページ内で戻して鳴らす・頭から）</button>
  <div id="log"></div>
</main>
<script>
const log=t=>{document.getElementById('log').textContent+=t+'\n'};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function unscramble(ab){const b=new Uint8Array(ab),R=mulberry32(0x5A1907E5);let w=0;for(let i=0;i<b.length;i++){if((i&3)===0)w=Math.floor(R()*4294967296)>>>0;b[i]^=(w>>>(8*(i&3)))&255;}return b.buffer;}
const urls={A:'test/tone48.m4a',C:'test/tone44.wav'};
// blob を使うものは、押す前に用意しておく（押した瞬間にすぐ鳴らすため）
Promise.all([
 fetch('test/tone48.m4a').then(r=>r.arrayBuffer()).then(b=>{urls.B=URL.createObjectURL(new Blob([b],{type:'audio/mp4'}));}),
 fetch('test/ballerino_aac.ogg').then(r=>r.arrayBuffer()).then(b=>{urls.D=URL.createObjectURL(new Blob([unscramble(b)],{type:'audio/mp4'}));}),
 fetch('audio/ballerino.ogg').then(r=>r.arrayBuffer()).then(b=>{urls.E=URL.createObjectURL(new Blob([unscramble(b)],{type:'audio/mpeg'}));}),
]).then(()=>log('準備完了')).catch(e=>log('準備に失敗 '+e));
let cur=null, timer=null;
for(const k of ['A','B','C','D','E']){
 document.getElementById(k).onclick=e=>{
  if(cur){cur.pause();cur.removeAttribute('src');cur.load();cur=null;} clearTimeout(timer);
  document.querySelectorAll('button').forEach(b=>b.classList.remove('on')); e.currentTarget.classList.add('on');
  if(!urls[k]){log(k+'：まだ準備中です');return;}
  const a=new Audio(urls[k]); a.setAttribute('playsinline',''); cur=a;   // テストごとに新しいプレーヤーを使う
  a.play().then(()=>log(k+'：再生')).catch(err=>log(k+'：再生できません '+err.message));
  timer=setTimeout(()=>{a.pause();log(k+'：停止');e.currentTarget.classList.remove('on');},8000);
 };
}
log(navigator.userAgent);
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGHON 録画テスト</title>
<style>
:root{--bg:#e8e8eb;--ink:#17161b;--paper:#fff;--accent:#c4267d}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Hiragino Sans",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:10px}
h1{font-size:1.2rem;margin:4px 0}
p{margin:0;font-size:.92rem}
button{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer}
button.on{border-color:var(--accent);background:#fbe3ef}
.no{display:inline-block;min-width:1.8em;font-weight:700}
video{width:120px;border-radius:6px;background:#000}
#log{background:var(--paper);border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;min-height:4em}
</style>
</head>
<body>
<main>
  <h1>SIGHON 録画テスト</h1>
  <p>マイクをオフにして画面収録を始めてから、①〜⑤を順に1つずつ押してください。どれも8秒鳴って自動で止まります。止まってから次を押してください。録画を見返して、ノイズなく普通に入っていた番号を教えてください。</p>
  <button id="b1"><span class="no">①</span>音声プレーヤーだけで Ballerino を鳴らす</button>
  <button id="b2"><span class="no">②</span>①と同じ＋解析用の計算（音を出さない仕組み）を作ってから鳴らす</button>
  <button id="b3"><span class="no">③</span>①と同じ＋水彩と同じくらい重い計算を動かしながら鳴らす</button>
  <button id="b4"><span class="no">④</span>①と同じ＋音を消した動画を同時に再生する</button>
  <button id="b5"><span class="no">⑤</span>一度読み取った音を WAV に作り直して鳴らす（自分の動画を読み込んだときの方式）</button>
  <video id="v" src="test/v.mp4" muted playsinline preload="auto" loop></video>
  <div id="log"></div>
</main>
<script>
const log=t=>{document.getElementById('log').textContent+=t+'\n'};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function unscramble(ab){const b=new Uint8Array(ab),R=mulberry32(0x5A1907E5);let w=0;for(let i=0;i<b.length;i++){if((i&3)===0)w=Math.floor(R()*4294967296)>>>0;b[i]^=(w>>>(8*(i&3)))&255;}return b.buffer;}
let raw=null, mp3Url=null, wavUrl=null, offline=null, busyLoop=false;
const a=new Audio(); a.setAttribute('playsinline',''); a.preload='auto';
const v=document.getElementById('v');
async function getRaw(){if(!raw){raw=unscramble(await (await fetch('audio/ballerino.ogg')).arrayBuffer());mp3Url=URL.createObjectURL(new Blob([raw],{type:'audio/mpeg'}));}return raw;}
function encodeWav(buf){const ch=Math.min(2,buf.numberOfChannels),sr=buf.sampleRate,n=buf.length,bytes=n*ch*2,ab=new ArrayBuffer(44+bytes),dv=new DataView(ab);
 const w=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
 w(0,'RIFF');dv.setUint32(4,36+bytes,true);w(8,'WAVE');w(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,ch,true);
 dv.setUint32(24,sr,true);dv.setUint32(28,sr*ch*2,true);dv.setUint16(32,ch*2,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,bytes,true);
 const d=[...Array(ch)].map((_,c)=>buf.getChannelData(c));let o=44;for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const x=Math.max(-1,Math.min(1,d[c][i]));dv.setInt16(o,x<0?x*0x8000:x*0x7FFF,true);o+=2;}
 return new Blob([ab],{type:'audio/wav'});}
function decodeOff(ab){const O=window.OfflineAudioContext||window.webkitOfflineAudioContext; offline=offline||new O(2,44100,44100);
 return new Promise((res,rej)=>{const p=offline.decodeAudioData(ab,res,rej); if(p&&p.then)p.then(res,rej);});}
// 水彩の計算と同じくらいの重さ（約4.6万マスの拡散計算を毎フレーム数回）
const N=288*162, A1=new Float32Array(N), A2=new Float32Array(N);
function heavy(){if(!busyLoop)return;for(let k=0;k<4;k++){for(let i=1;i<N-1;i++){A2[i]=(A1[i-1]+A1[i]+A1[i+1])/3+Math.random()*1e-3;}A1.set(A2);}requestAnimationFrame(heavy);}
let timer=null;
function stopAll(){a.pause();v.pause();busyLoop=false;document.querySelectorAll('button').forEach(b=>b.classList.remove('on'));}
async function run(btn,label,prep){
 stopAll(); clearTimeout(timer); btn.classList.add('on');
 try{
  const url=await prep(); if(a.src!==url)a.src=url; a.currentTime=20; await a.play(); log(label+'：再生');
  timer=setTimeout(()=>{stopAll();log(label+'：停止');},8000);
 }catch(e){log(label+'：再生できません '+(e&&e.message)); stopAll();}
}
// iPhone では、押した直後に再生を始めないと音付きで鳴らないことがあるので、準備は最初の1回だけ先に済ませる
getRaw().then(()=>log('準備完了')).catch(e=>log('読み込みに失敗 '+e));
document.getElementById('b1').onclick=e=>run(e.currentTarget,'①',async()=>{await getRaw();return mp3Url;});
document.getElementById('b2').onclick=e=>run(e.currentTarget,'②',async()=>{await getRaw();if(!offline){await decodeOff(raw.slice(0));log('②：解析用の計算を作成');}return mp3Url;});
document.getElementById('b3').onclick=e=>run(e.currentTarget,'③',async()=>{await getRaw();busyLoop=true;heavy();return mp3Url;});
document.getElementById('b4').onclick=e=>run(e.currentTarget,'④',async()=>{await getRaw();v.currentTime=0;v.play().catch(()=>{});return mp3Url;});
document.getElementById('b5').onclick=e=>run(e.currentTarget,'⑤',async()=>{await getRaw();if(!wavUrl){const buf=await decodeOff(raw.slice(0));wavUrl=URL.createObjectURL(encodeWav(buf));log('⑤：WAVを作成（'+buf.sampleRate+'Hz）');}return wavUrl;});
log(navigator.userAgent);
</script>
</body>
</html>
